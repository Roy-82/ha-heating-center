name: Publish HA Heating Center Beta

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/heating_center/manifest.json'
      - 'assets/heating-center-logo.svg'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heating-center-release
  cancel-in-progress: false

jobs:
  brand-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render Home Assistant local brand PNG icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          from pathlib import Path
          from cairosvg import svg2png
          brand = Path("custom_components/heating_center/brand")
          brand.mkdir(parents=True, exist_ok=True)
          source = "assets/heating-center-logo.svg"
          for name, size in (("icon.png", 256), ("icon@2x.png", 512)):
              svg2png(url=source, write_to=str(brand / name), output_width=size, output_height=size)
          PY
      - name: Commit local icons if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/heating_center/brand/icon.png custom_components/heating_center/brand/icon@2x.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: render local HA brand PNG icons"
            git push origin HEAD:main
          fi
      - name: Publish matching GitHub release for HACS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/heating_center/manifest.json"))["version"])')"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
          else
            gh release create "$VERSION" \
              --title "HA Heating Center $VERSION" \
              --target "$(git rev-parse HEAD)" \
              --prerelease \
              --notes "Beta: Gruppen-Temperaturfeld bleibt bei HA-Zustandsupdates bedienbar, Eingaben werden validiert. Eigenes Heating-Center-Logo in Home Assistant und GitHub. Bitte vor dem Update ein HA-Backup anlegen."
          fi
